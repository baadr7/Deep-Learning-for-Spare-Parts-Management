# Intégration continue (§ 8 du cahier des charges) : style et tests Python, construction et tests
# de l'interface, parcours de bout en bout, puis compilation du rapport. Chaque poussée et chaque
# demande de fusion déclenche les quatre tâches.
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  python:
    name: Python (ruff, pytest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Installer uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: Installer les dépendances
        run: uv sync --frozen --extra ml
      - name: Vérifier le style
        run: uv run ruff check src tests scripts
      - name: Lancer les tests avec couverture
        run: uv run pytest -q --cov=spareparts --cov-report=term-missing

  web:
    name: Interface (build, Vitest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - name: Installer Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Installer les dépendances
        run: npm ci
      - name: Vérifier les types et construire
        run: npm run build
      - name: Tests des composants
        run: npm run test

  e2e:
    name: Bout en bout (Playwright)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Installer Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Installer uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      # Le parcours s'appuie uniquement sur les données simulées : aucun jeu de données Azure
      # n'est nécessaire. En revanche la page « Scénarios » interroge le modèle de substitution
      # committé (models/surrogate), qui exige l'extra « ml » (PyTorch) côté API.
      - name: Installer les dépendances Python (API et modèle de substitution)
        run: uv sync --frozen --extra ml
      - name: Installer les dépendances de l'interface
        working-directory: web
        run: npm ci
      # La configuration Playwright cible le canal « msedge », comme sur le poste de référence.
      - name: Installer le navigateur Playwright (canal msedge)
        working-directory: web
        run: npx playwright install --with-deps msedge
      - name: Démarrer l'API et l'interface, puis attendre leur disponibilité
        run: |
          nohup uv run uvicorn spareparts.api.app:app --host 127.0.0.1 --port 8000 > /tmp/api.log 2>&1 &
          nohup npm --prefix web run dev -- --host 127.0.0.1 --port 5173 > /tmp/web.log 2>&1 &
          for i in $(seq 1 60); do
            if curl -sf http://127.0.0.1:8000/api/health >/dev/null && curl -sf http://127.0.0.1:5173 >/dev/null; then
              echo "API et interface disponibles."
              exit 0
            fi
            sleep 2
          done
          echo "Démarrage trop long : journal de l'API et de l'interface." >&2
          cat /tmp/api.log /tmp/web.log >&2
          exit 1
      - name: Lancer les tests de bout en bout
        working-directory: web
        run: npx playwright test
      - name: Téléverser le rapport Playwright en cas d'échec
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: web/playwright-report
          retention-days: 7

  rapport:
    name: Rapport (XeLaTeX)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # TeX Live complet, avec XeLaTeX, latexmk et les polices libres de repli. Le rapport emploie
      # les polices du poste de référence lorsqu'elles existent et bascule sinon vers Pagella et
      # Heros (voir l'en-tête de rapport.tex) : la compilation aboutit sur un poste Windows comme
      # sur ce conteneur Linux.
      - name: Compiler le rapport en PDF
        uses: docker://texlive/texlive:latest
        with:
          entrypoint: latexmk
          args: -xelatex -cd -interaction=nonstopmode -halt-on-error -file-line-error docs/rapport/rapport.tex
      - name: Téléverser le rapport compilé
        uses: actions/upload-artifact@v4
        with:
          name: rapport
          path: docs/rapport/rapport.pdf
          retention-days: 7
