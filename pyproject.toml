[project]
name = "spareparts"
version = "0.1.0"
description = "Pilotage conjoint de la maintenance et du stock de pièces de rechange d'une flotte de machines"
readme = "README.md"
requires-python = ">=3.11,<3.13"
authors = [{ name = "MA Bilal" }, { name = "Adam Elmadani" }]
dependencies = [
    "numpy>=1.26",
    "pandas>=2.2",
    "pyarrow>=15",
    "scipy>=1.12",
    "simpy>=4.1",
    "pydantic>=2.6",
    "pyyaml>=6.0",
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
]

[project.optional-dependencies]
ml = [
    "torch>=2.2",
    "gymnasium>=0.29",
    "stable-baselines3>=2.3",
    "sb3-contrib>=2.3",
    "scikit-learn>=1.4",
    "lightgbm>=4.3",
    "lifelines>=0.28",
    "optuna>=3.6",
    "SALib>=1.4.8",
    "tensorboard>=2.16",
    "mlflow>=2.14",
]

[dependency-groups]
dev = ["pytest>=8", "pytest-cov>=5", "ruff>=0.4", "httpx>=0.27"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/spareparts"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]

# Couverture de référence (§ 8) : la cible est mesurée sur la suite de tests ; le seuil
# est fixé deux points sous la valeur observée pour laisser une marge aux évolutions.
[tool.coverage.run]
source = ["src/spareparts"]

[tool.coverage.report]
show_missing = true
fail_under = 80
