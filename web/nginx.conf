server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # L'application appelle l'API en relatif (/api/...) : Nginx la relaie vers le service api,
    # si bien que le navigateur ne voit qu'une seule origine. L'en-tête Upgrade laisse passer
    # le WebSocket de la page « Flotte en direct ».
    location /api/ {
        proxy_pass http://api:8000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # Application monopage : toute route inconnue est servie par index.html.
    location / {
        try_files $uri /index.html;
    }
}
